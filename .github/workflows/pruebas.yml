# Corre las pruebas del sitio (npm test) en cada PR y en cada cambio a main.
# Incluye la revisión de que la portada (index.html) esté al día con proyectos.json.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm test
        run: npm test
